loginTotpTitle=Activa la verificaci\u00f3n en dos pasos
loginTotpStep1=Instala <a href="https://freeotp.github.io/" target="_blank" rel="noopener noreferrer">FreeOTP</a> en tu dispositivo m\u00f3vil. Est\u00e1 disponible en <a href="https://play.google.com/store/apps/details?id=org.fedorahosted.freeotp" target="_blank" rel="noopener noreferrer">Google Play</a> y en la <a href="https://apps.apple.com/app/freeotp-authenticator/id872559395" target="_blank" rel="noopener noreferrer">App Store</a>.
loginTotpStep3=Introduce el c\u00f3digo de 6 d\u00edgitos que te muestra la aplicaci\u00f3n FreeOTP y presiona "Enviar" para finalizar la configuraci\u00f3n.

