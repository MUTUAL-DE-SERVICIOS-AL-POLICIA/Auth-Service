# Funciones estructurales requeridas por la autenticación web.
features=token-exchange:v1,admin-fine-grained-authz:v1

# La plataforma usa PostgreSQL para persistir el estado de Keycloak.
db=postgres

# Habilita los endpoints internos de salud.
health-enabled=true

# La conexión se deriva de DB_* del launcher y el schema se recibe mediante
# KC_DB_SCHEMA desde Auth-Service/.env.compose.
